<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Droplet Body Fluid Gradient -->
    <radialGradient id="wbDropGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="22%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>

    <!-- Sprout Leaf Organic Gradient -->
    <linearGradient id="wbLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="35%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Ambient Shadow & Glow for Transparent Background -->
    <filter id="wbTransparentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0284c7" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>

    <filter id="wbLeafShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#15803d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 100% TRANSPARENT BACKGROUND (No Background Rect/Rim) -->

  <!-- Sprout Stem & Leaf from Top of Droplet -->
  <g filter="url(#wbLeafShadow)">
    <!-- Curved Stem -->
    <path d="M256 160 Q275 125 310 110" stroke="#22c55e" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Fresh Vibrant Green Leaf -->
    <path d="M310 110 C345 75 395 80 405 115 C405 155 355 170 310 110 Z" fill="url(#wbLeafGrad)"/>
    <!-- Leaf Center Vein -->
    <path d="M315 112 Q355 118 395 112" stroke="#dcfce7" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>

  <!-- Glowing Water Droplet Mascot Body -->
  <g filter="url(#wbTransparentGlow)">
    <path d="M256 128 C256 128 144 260 144 336 C144 398 194 448 256 448 C318 448 368 398 368 336 C368 260 256 128 256 128 Z" fill="url(#wbDropGrad)"/>
  </g>

  <!-- Specular Glass Highlight Curves (3D Glass Caustic Sheen) -->
  <path d="M190 270 C175 310 178 370 215 410 C195 385 190 335 206 285 Q212 268 190 270 Z" fill="#ffffff" opacity="0.45"/>
  <ellipse cx="205" cy="245" rx="12" ry="24" transform="rotate(-30 205 245)" fill="#ffffff" opacity="0.8"/>

  <!-- Expressive Friendly Eyes -->
  <g>
    <!-- Left Eye -->
    <ellipse cx="218" cy="336" rx="16" ry="20" fill="#0f172a"/>
    <circle cx="223" cy="328" r="7" fill="#ffffff"/>
    <circle cx="213" cy="344" r="3.5" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="294" cy="336" rx="16" ry="20" fill="#0f172a"/>
    <circle cx="299" cy="328" r="7" fill="#ffffff"/>
    <circle cx="289" cy="344" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Rosy Cheeks -->
  <ellipse cx="188" cy="360" rx="16" ry="10" fill="#f43f5e" opacity="0.5"/>
  <ellipse cx="324" cy="360" rx="16" ry="10" fill="#f43f5e" opacity="0.5"/>

  <!-- Cheerful Happy Smile -->
  <path d="M234 366 Q256 390 278 366" stroke="#0f172a" stroke-width="7" stroke-linecap="round" fill="#e11d48"/>
  <path d="M242 372 Q256 384 270 372" fill="#ffffff" opacity="0.95"/>
</svg>
